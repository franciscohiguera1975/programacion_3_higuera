<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación de DOM</title>
    <script src="dom13-area-trapecio.js" defer></script>

</head>

<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2>Calculo del área de un triángulo</h2>

    <input id="baseMayor" 
        type="number"

        type="number"

    class="boton">

    <div id="error"></div>
    <p id="resultado"></p>
</body>
